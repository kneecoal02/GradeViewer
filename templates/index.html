<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Student Gateway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <!-- Top Right Login Button -->
    <button id="topLoginBtn" class="top-login-btn">
        <i class="ph ph-sign-in"></i> Admin
    </button>

    <div id="toast-container"></div>

    <div class="card">
        <div class="header">
            <div class="logo-placeholder"><i class="ph-fill ph-graduation-cap"></i></div>
            <h1>Secure Portal</h1>
            <p>Authenticate to access academic records</p>
        </div>

        <form id="entryForm">
            <div class="form-group">
                <label for="accessCode">Access Code</label>
                <div class="input-wrapper">
                    <i class="ph ph-key"></i>
                    <input type="text" id="accessCode" name="accessCode" placeholder="Enter unique access code" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group half">
                    <label for="section">Section</label>
                    <div class="input-wrapper">
                        <i class="ph ph-users"></i>
                        <select id="section" name="section" required>
                            <option value="" disabled selected>Select...</option>
                            <option value="BSIT2-3">BSIT2-3</option>
                            <option value="BSIT2-6">BSIT2-6</option>
                            <option value="BSIT2-11">BSIT2-11</option>
                            <option value="BSIT2-12">BSIT2-12</option>
                        </select>
                    </div>
                </div>

                <div class="form-group half">
                    <label for="subject">Course Subject</label>
                    <div class="input-wrapper">
                        <i class="ph ph-book-bookmark"></i>
                        <select id="subject" name="subject" required>
                            <option value="" disabled selected>Choose...</option>
                            <option value="ITE 300">ITE 300</option>
                            <option value="ITE 298">ITE 298</option>
                            <option value="ITE 031">ITE 031</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">Initialize Query</span>
                <div class="loader" id="btnLoader" style="display: none;"></div>
            </button>
        </form>
    </div>

    <!-- PRO DATA MODAL -->
    <div id="gradeModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn"><i class="ph ph-x"></i></button>
            
            <div class="modal-header-pro">
                <div class="profile-section">
                    <div class="profile-avatar"><i class="ph-fill ph-user"></i></div>
                    <div class="profile-details">
                        <h2 id="modalStudentName">Loading...</h2>
                    </div>
                </div>
                <div class="meta-section">
                    <div class="status-badge"><i class="ph-fill ph-check-circle"></i> Verified Record</div>
                    <p id="modalCourseInfo">Loading Course Info...</p>
                </div>
            </div>
            
            <div id="gradesContainer">
                <!-- Table injected dynamically -->
            </div>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="adminLoginModal" class="login-modal-overlay">
        <div class="login-modal-content">
            <button class="login-close-btn" id="closeLoginModal"><i class="ph ph-x"></i></button>
            <div class="header" style="margin-bottom: 25px;">
                <h2 style="font-size: 20px; color: #fafafa; margin-bottom: 5px;">Admin Access</h2>
                <p style="font-size: 13px; color: #a1a1aa;">Enter credentials to proceed</p>
            </div>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminUsername">Username</label>
                    <div class="input-wrapper">
                        <i class="ph ph-user"></i>
                        <input type="text" id="adminUsername" required placeholder="Enter username">
                    </div>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="ph ph-lock-key"></i>
                        <input type="password" id="adminPassword" required placeholder="Enter password">
                    </div>
                </div>
                <button type="submit" class="btn-submit" style="margin-top: 20px;">
                    <span class="btn-text">Login</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Upload Modal -->
    <div id="adminUploadModal" class="login-modal-overlay">
        <div class="login-modal-content">
            <button class="login-close-btn" id="closeUploadModal"><i class="ph ph-x"></i></button>
            <div class="header" style="margin-bottom: 25px;">
                <div class="logo-placeholder" style="width: 40px; height: 40px; font-size: 20px; margin-bottom: 10px;"><i class="ph-fill ph-file-xls"></i></div>
                <h2 style="font-size: 20px; color: #fafafa; margin-bottom: 5px;">Update Records</h2>
                <p style="font-size: 13px; color: #a1a1aa;">Upload the latest Grades.xlsx file</p>
            </div>
            <form id="adminUploadForm">
                <div class="form-group">
                    <div class="file-upload-wrapper">
                        <input type="file" id="excelFile" accept=".xlsx" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="uploadBtn" style="margin-top: 20px;">
                    <span class="btn-text">Upload Grades.xlsx</span>
                    <div class="loader" id="uploadLoader" style="display: none;"></div>
                </button>
            </form>
        </div>
    </div>

    <script>
        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'success' ? 'toast-success' : 'toast-error'}`;
            
            const icon = type === 'error' ? '<i class="ph-fill ph-warning-circle"></i>' : '<i class="ph-fill ph-check-circle"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // --- Student Query Form Logic ---
        document.getElementById('entryForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const btn = document.getElementById('submitBtn');
            const btnText = btn.querySelector('.btn-text');
            const loader = document.getElementById('btnLoader');
            
            btn.disabled = true;
            btnText.style.opacity = '0.5';
            loader.style.display = 'block';

            const payload = {
                accessCode: document.getElementById('accessCode').value,
                section: document.getElementById('section').value,
                subject: document.getElementById('subject').value
            };

            fetch('/get_grades', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    document.getElementById('modalStudentName').textContent = result.student_name;
                    document.getElementById('modalCourseInfo').textContent = `${result.subject_full} • ${result.section}`;
                    
                    const container = document.getElementById('gradesContainer');
                    let elementsTable = '<div class="table-scroll-wrapper"><table class="grades-table-horizontal">';
                    
                    let row1 = '<tr>';
                    let row2 = '<tr>';
                    let row3 = '<tr class="data-row">';

                    // Check if everything is completely empty
                    if(result.modules_data.length === 0 && result.final_grades.length === 0) {
                        row1 += `<th class="header-cat-title header-main">No Data Available</th>`;
                        row2 += `<th class="header-main">-</th>`;
                        row3 += `<td>-</td>`;
                    } else {
                        // Render dynamically discovered module columns
                        result.modules_data.forEach(cat => {
                            row1 += `<th colspan="${cat.items.length}" class="header-cat-title header-${cat.class_type}">${cat.category_name}</th>`;
                            
                            cat.items.forEach(item => {
                                row2 += `<th class="header-${cat.class_type}-sub">${item.sub_header}</th>`;
                                row3 += `<td><div class="grade-cell">${item.value}</div></td>`;
                            });
                        });

                        // Render dynamically discovered final grade columns
                        result.final_grades.forEach(fg => {
                            row1 += `<th rowspan="2" class="header-main sticky-col-right" style="min-width: 90px">${fg.title}</th>`;
                            row3 += `<td class="text-bold sticky-col-right highlight-grade">${fg.value}</td>`;
                        });
                    }

                    row1 += '</tr>';
                    row2 += '</tr>';
                    row3 += '</tr>';
                    
                    elementsTable += row1 + row2 + row3 + '</table></div>';
                    container.innerHTML = elementsTable;

                    document.getElementById('gradeModal').style.display = 'flex';
                } else {
                    showToast(result.message, 'error');
                }
            })
            .catch(err => {
                console.error('Network Error:', err);
                showToast('Unable to reach server. Please check your connection.', 'error');
            })
            .finally(() => {
                btn.disabled = false;
                btnText.style.opacity = '1';
                loader.style.display = 'none';
            });
        });

        // Close Data Modal
        document.querySelector('.close-btn').addEventListener('click', () => {
            document.getElementById('gradeModal').style.display = 'none';
        });

        // --- Admin Logic ---
        const topLoginBtn = document.getElementById('topLoginBtn');
        const adminLoginModal = document.getElementById('adminLoginModal');
        const closeLoginModal = document.getElementById('closeLoginModal');
        const adminLoginForm = document.getElementById('adminLoginForm');
        const adminUploadModal = document.getElementById('adminUploadModal');
        const closeUploadModal = document.getElementById('closeUploadModal');
        const adminUploadForm = document.getElementById('adminUploadForm');

        // Open Login Modal
        topLoginBtn.addEventListener('click', () => {
            adminLoginModal.style.display = 'flex';
        });

        // Close Login Modal
        closeLoginModal.addEventListener('click', () => {
            adminLoginModal.style.display = 'none';
        });

        // Close Upload Modal
        closeUploadModal.addEventListener('click', () => {
            adminUploadModal.style.display = 'none';
        });

        // Handle Login Submission
        adminLoginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('adminUsername').value;
            const pass = document.getElementById('adminPassword').value;

            if (user === 'admin' && pass === 'admin123') {
                showToast('Login successful! Welcome Admin.', 'success');
                adminLoginModal.style.display = 'none';
                adminLoginForm.reset();
                
                setTimeout(() => {
                    adminUploadModal.style.display = 'flex';
                }, 300); 
                
            } else {
                showToast('Invalid username or password.', 'error');
            }
        });

        // Handle Excel Upload Submission
        adminUploadForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('excelFile');
            const file = fileInput.files[0];
            
            if (!file) {
                showToast('Please select a file first.', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            const btn = document.getElementById('uploadBtn');
            const btnText = btn.querySelector('.btn-text');
            const loader = document.getElementById('uploadLoader');

            btn.disabled = true;
            btnText.style.opacity = '0.5';
            loader.style.display = 'block';

            fetch('/upload_excel', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    showToast(result.message, 'success');
                    adminUploadModal.style.display = 'none';
                    adminUploadForm.reset();
                } else {
                    showToast(result.message, 'error');
                }
            })
            .catch(err => {
                console.error('Upload Error:', err);
                showToast('Failed to upload file. Please check your connection.', 'error');
            })
            .finally(() => {
                btn.disabled = false;
                btnText.style.opacity = '1';
                loader.style.display = 'none';
            });
        });

        // Close Modals if clicked outside
        window.addEventListener('click', (e) => {
            const gradeModal = document.getElementById('gradeModal');
            if (e.target === gradeModal) gradeModal.style.display = 'none';
            if (e.target === adminLoginModal) adminLoginModal.style.display = 'none';
            if (e.target === adminUploadModal) adminUploadModal.style.display = 'none';
        });
    </script>
</body>
</html>
