<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Student Gateway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div id="toast-container"></div>

    <div class="card">
        <div class="header">
            <div class="logo-placeholder"><i class="ph-fill ph-graduation-cap"></i></div>
            <h1>Secure Portal</h1>
            <p>Authenticate to access academic records</p>
        </div>

        <form id="entryForm">
            <div class="form-group">
                <label for="idNumber">Student ID</label>
                <div class="input-wrapper">
                    <i class="ph ph-identification-card"></i>
                    <input type="text" id="idNumber" name="idNumber" placeholder="e.g. 2024-00123" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group half">
                    <label for="section">Section</label>
                    <div class="input-wrapper">
                        <i class="ph ph-users"></i>
                        <select id="section" name="section" required>
                            <option value="" disabled selected>Select...</option>
                            <option value="BSIT2-3">BSIT2-3</option>
                            <option value="BSIT2-6">BSIT2-6</option> <!-- NEW SECTION ADDED -->
                            <option value="BSIT2-11">BSIT2-11</option>
                            <option value="BSIT2-12">BSIT2-12</option>
                        </select>
                    </div>
                </div>

                <div class="form-group half">
                    <label for="period">Term</label>
                    <div class="input-wrapper">
                        <i class="ph ph-calendar-blank"></i>
                        <select id="period" name="period" required>
                            <option value="" disabled selected>Select...</option>
                            <option value="P1">P1</option>
                            <option value="P2">P2</option>
                            <option value="P3">P3</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group half">
                    <label for="subject">Course Subject</label>
                    <div class="input-wrapper">
                        <i class="ph ph-book-bookmark"></i>
                        <select id="subject" name="subject" required>
                            <option value="" disabled selected>Choose...</option>
                            <option value="ITE 300">ITE 300</option>
                            <option value="ITE 298">ITE 298</option>
                            <option value="ITE 031">ITE 031</option>
                        </select>
                    </div>
                </div>

                <div class="form-group half">
                    <label for="teacher">Instructor</label>
                    <div class="input-wrapper">
                        <i class="ph ph-chalkboard-teacher"></i>
                        <select id="teacher" name="teacher" required>
                            <option value="" disabled selected>Select...</option>
                            <option value="Kurt Ellie R. Parel">Kurt Ellie R. Parel</option>
                            <option value="Nicole Lampa">Nicole Lampa</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">Initialize Query</span>
                <div class="loader" id="btnLoader" style="display: none;"></div>
            </button>
        </form>
    </div>

    <!-- PRO DATA MODAL -->
    <div id="gradeModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn"><i class="ph ph-x"></i></button>
            
            <div class="modal-header-pro">
                <div class="profile-section">
                    <div class="profile-avatar"><i class="ph-fill ph-user"></i></div>
                    <div class="profile-details">
                        <h2 id="modalStudentName">Loading...</h2>
                        <p id="modalStudentId">ID: Loading...</p>
                    </div>
                </div>
                <div class="meta-section">
                    <div class="status-badge"><i class="ph-fill ph-check-circle"></i> Verified Record</div>
                    <p id="modalCourseInfo">Loading Course Info...</p>
                </div>
            </div>
            
            <div id="gradesContainer">
                <!-- Table injected dynamically -->
            </div>
        </div>
    </div>

    <script>
        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            const icon = type === 'error' ? '<i class="ph-fill ph-warning-circle"></i>' : '<i class="ph-fill ph-info"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        document.getElementById('entryForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const btn = document.getElementById('submitBtn');
            const btnText = btn.querySelector('.btn-text');
            const loader = document.getElementById('btnLoader');
            
            btn.disabled = true;
            btnText.style.opacity = '0.5';
            loader.style.display = 'block';

            const payload = {
                idNumber: document.getElementById('idNumber').value,
                section: document.getElementById('section').value,
                period: document.getElementById('period').value,
                subject: document.getElementById('subject').value,
                teacher: document.getElementById('teacher').value 
            };

            fetch('/get_grades', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    // Populate Profile Header
                    document.getElementById('modalStudentName').textContent = result.student_name;
                    document.getElementById('modalStudentId').textContent = `ID Number: ${result.id_number}`;
                    // Added Teacher to the header metadata
                    document.getElementById('modalCourseInfo').textContent = `${result.subject_full} • ${result.section} • Term ${result.period} • Prof. ${result.teacher}`;
                    
                    const container = document.getElementById('gradesContainer');
                    let elementsTable = '<div class="table-scroll-wrapper"><table class="grades-table-horizontal">';
                    
                    let row1 = '<tr>';
                    let row2 = '<tr>';
                    let row3 = '<tr class="data-row">';

                    // Build table columns dynamically 
                    if(result.modules_data.length === 0) {
                        row1 += `<th class="header-cat-title header-main">No Data Available</th>`;
                        row2 += `<th class="header-main">-</th>`;
                        row3 += `<td>-</td>`;
                    } else {
                        result.modules_data.forEach(cat => {
                            row1 += `<th colspan="${cat.items.length}" class="header-cat-title header-${cat.class_type}">${cat.category_name}</th>`;
                            
                            cat.items.forEach(item => {
                                row2 += `<th class="header-${cat.class_type}-sub">${item.sub_header}</th>`;
                                row3 += `<td><div class="grade-cell">${item.value}</div></td>`;
                            });
                        });
                    }

                    row1 += `<th rowspan="2" class="header-main sticky-col-right">Final Grade</th>`;
                    row1 += '</tr>';
                    row2 += '</tr>';
                    row3 += `<td class="text-bold sticky-col-right highlight-grade">${result.final_grade}</td>`;
                    row3 += '</tr>';
                    
                    elementsTable += row1 + row2 + row3 + '</table></div>';
                    container.innerHTML = elementsTable;

                    document.getElementById('gradeModal').style.display = 'flex';
                } else {
                    showToast(result.message, 'error');
                }
            })
            .catch(err => {
                console.error('Network Error:', err);
                showToast('Unable to reach server. Please check your connection.', 'error');
            })
            .finally(() => {
                btn.disabled = false;
                btnText.style.opacity = '1';
                loader.style.display = 'none';
            });
        });

        document.querySelector('.close-btn').addEventListener('click', () => {
            document.getElementById('gradeModal').style.display = 'none';
        });
        window.addEventListener('click', (e) => {
            const modal = document.getElementById('gradeModal');
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
