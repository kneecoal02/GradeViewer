<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Student Gateway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* --- DYNAMIC COLOR CODING FOR PERIODS (P1, P2, P3) --- */
        
        /* P1: Modules/Weeks 1 to 4 (Blue) */
        .color-p1 { color: #60a5fa !important; }
        .bg-p1 { background: rgba(96, 165, 250, 0.15) !important; color: #60a5fa !important; border-bottom: 2px solid rgba(96, 165, 250, 0.4) !important; }
        
        /* P2: Modules/Weeks 5 to 9 (Green) */
        .color-p2 { color: #34d399 !important; }
        .bg-p2 { background: rgba(52, 211, 153, 0.15) !important; color: #34d399 !important; border-bottom: 2px solid rgba(52, 211, 153, 0.4) !important; }
        
        /* P3: Modules/Weeks 10 to 14 (Purple) */
        .color-p3 { color: #a78bfa !important; }
        .bg-p3 { background: rgba(167, 139, 250, 0.15) !important; color: #a78bfa !important; border-bottom: 2px solid rgba(167, 139, 250, 0.4) !important; }
        
        /* Default for anything else */
        .color-default { color: #f4f4f5 !important; }
        .bg-default { background: rgba(255, 255, 255, 0.05) !important; color: #f4f4f5 !important; border-bottom: 2px solid rgba(255, 255, 255, 0.1) !important; }

        /* Table & Layout styling */
        .grades-table-horizontal th { padding: 10px; font-size: 12px; font-weight: 700; text-align: center; }
        .grades-table-horizontal td { padding: 12px 10px; text-align: center; border-right: 1px solid rgba(255,255,255,0.02); }
        .grades-table-horizontal td:last-child { border-right: none; }
        .grade-cell { font-weight: 700; font-size: 14px; }
        
        .period-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 12px;
            font-weight: 700;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            letter-spacing: 0.5px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="card">
        <div class="header">
            <div class="logo-placeholder"><i class="ph-fill ph-graduation-cap"></i></div>
            <h1>Grade Viewer</h1>
            <p>Authenticate to access academic records</p>
        </div>

        <form id="entryForm">
            <div class="form-group">
                <label for="accessCode">Access Code</label>
                <div class="input-wrapper">
                    <i class="ph ph-key"></i>
                    <input type="password" id="accessCode" name="accessCode" placeholder="Enter unique access code" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group half" style="width: 100%;">
                    <label for="section">Section</label>
                    <div class="input-wrapper">
                        <i class="ph ph-users"></i>
                        <select id="section" name="section" required>
                            <option value="" disabled selected>Select...</option>
                            <option value="BSIT2-3">BSIT2-3</option>
                            <option value="BSIT2-4">BSIT2-4</option>
                            <option value="BSIT2-5">BSIT2-5</option>
                            <option value="BSIT2-6">BSIT2-6</option>
                            <option value="BSIT2-8">BSIT2-8</option>
                            <option value="BSIT2-9">BSIT2-9</option>
                            <option value="BSIT2-11">BSIT2-11</option>
                            <option value="BSIT2-12">BSIT2-12</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="subject">Course Subject</label>
                <div class="input-wrapper">
                    <i class="ph ph-book-bookmark"></i>
                    <select id="subject" name="subject" required>
                        <option value="" disabled selected>Choose...</option>
                        <option value="ITE 300">ITE 300</option>
                        <option value="ITE 298">ITE 298</option>
                        <option value="ITE 031">ITE 031</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">Initialize Query</span>
                <div class="loader" id="btnLoader" style="display: none;"></div>
            </button>
        </form>
    </div>

    <!-- PRO DATA MODAL -->
    <div id="gradeModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 850px; max-height: 90vh; display: flex; flex-direction: column;">
            <button class="close-btn"><i class="ph ph-x"></i></button>
            
            <div class="modal-header-pro" style="flex-shrink: 0;">
                <div class="profile-section">
                    <div class="profile-avatar"><i class="ph-fill ph-user"></i></div>
                    <div class="profile-details">
                        <h2 id="modalStudentName">Loading...</h2>
                    </div>
                </div>
                <div class="meta-section">
                    <div class="status-badge"><i class="ph-fill ph-check-circle"></i> Verified Record</div>
                    <p id="modalCourseInfo">Loading Course Info...</p>
                </div>
            </div>
            
            <div id="gradesContainer" style="display: flex; flex-direction: column; gap: 20px; margin-top: 15px; overflow-y: auto; padding-right: 10px; flex-grow: 1;">
            </div>
        </div>
    </div>

    <script>
        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'success' ? 'toast-success' : 'toast-error'}`;
            const icon = type === 'error' ? '<i class="ph-fill ph-warning-circle"></i>' : '<i class="ph-fill ph-check-circle"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // --- Helper Function to Determine Period Class by Number (FIXED REGEX) ---
        function getPeriodClass(subHeader, type = 'bg') {
            if (!subHeader) return `${type}-default`;
            
            // This grabs any number in the string (e.g., 'M1' -> '1', 'Week 12' -> '12')
            const numMatch = subHeader.match(/[0-9]+/); 
            
            if (!numMatch) return `${type}-default`;
            
            const num = parseInt(numMatch[0]);
            
            if (num >= 1 && num <= 4) return `${type}-p1`;
            if (num >= 5 && num <= 9) return `${type}-p2`;
            if (num >= 10 && num <= 14) return `${type}-p3`;
            
            return `${type}-default`;
        }

        document.getElementById('entryForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const btn = document.getElementById('submitBtn');
            const btnText = btn.querySelector('.btn-text');
            const loader = document.getElementById('btnLoader');
            
            btn.disabled = true;
            btnText.style.opacity = '0.5';
            loader.style.display = 'block';

            const payload = {
                accessCode: document.getElementById('accessCode').value,
                section: document.getElementById('section').value,
                subject: document.getElementById('subject').value
            };

            fetch('/get_grades', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    document.getElementById('modalStudentName').textContent = result.student_name;
                    document.getElementById('modalCourseInfo').textContent = `${result.subject_full} • ${result.section}`;
                    
                    const container = document.getElementById('gradesContainer');
                    let htmlContent = '';

                    if(result.modules_data.length === 0 && result.final_grades.length === 0) {
                        htmlContent = '<div style="text-align:center; color:#a1a1aa; padding: 20px;">No grade records available.</div>';
                    } else {
                        // --- 1. RENDER THE LEGEND ---
                        htmlContent += `
                            <div class="period-legend">
                                <div class="legend-item"><span style="color: #60a5fa; font-size: 16px;">■</span> P1 - MODULE 1 TO 4</div>
                                <div class="legend-item"><span style="color: #34d399; font-size: 16px;">■</span> P2 - MODULE 1 TO 9</div>
                                <div class="legend-item"><span style="color: #a78bfa; font-size: 16px;">■</span> P3 - MODULE 1 TO 14</div>
                            </div>
                        `;

                        // --- 2. RENDER THE TABLES ---
                        result.modules_data.forEach((cat) => {
                            htmlContent += `
                                <div class="grade-block" style="background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 16px;">
                                    <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; color: #f4f4f5;">
                                        ${cat.category_name}
                                    </div>
                                    <div class="table-scroll-wrapper" style="overflow-x: auto;">
                                        <table class="grades-table-horizontal" style="width: 100%; border-collapse: collapse;">
                                            <thead>
                                                <tr>
                                                    ${cat.items.map(item => `
                                                        <th class="${getPeriodClass(item.sub_header, 'bg')}" style="border-radius: 6px 6px 0 0;">
                                                            ${item.sub_header}
                                                        </th>
                                                    `).join('')}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr class="data-row" style="background: rgba(255, 255, 255, 0.02);">
                                                    ${cat.items.map(item => `
                                                        <td>
                                                            <div class="grade-cell ${getPeriodClass(item.sub_header, 'color')}">
                                                                ${item.value}
                                                            </div>
                                                        </td>
                                                    `).join('')}
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            `;
                        });

                        // --- 3. FINAL/PERIODIC GRADES SUMMARY ---
                        if(result.final_grades.length > 0) {
                            htmlContent += `
                                <div class="grade-block" style="background: rgba(99, 102, 241, 0.05); border: 1px solid rgba(99, 102, 241, 0.2); border-radius: 12px; padding: 16px;">
                                    <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #a1a1aa; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                                        PERIODIC GRADES
                                    </div>
                                    <div class="table-scroll-wrapper" style="overflow-x: auto;">
                                        <table class="grades-table-horizontal" style="width: 100%; border-collapse: collapse;">
                                            <thead>
                                                <tr>
                                                    ${result.final_grades.map(fg => `<th style="background: rgba(255,255,255,0.05); color: #fff; border-bottom: 2px solid rgba(255,255,255,0.1); border-radius: 6px 6px 0 0;">${fg.title}</th>`).join('')}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr class="data-row">
                                                    ${result.final_grades.map(fg => `<td style="color: #60a5fa; font-weight: bold; font-size: 16px;">${fg.value}</td>`).join('')}
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            `;
                        }
                    }

                    container.innerHTML = htmlContent;
                    document.getElementById('gradeModal').style.display = 'flex';
                } else {
                    showToast(result.message, 'error');
                }
            })
            .catch(err => {
                showToast('Unable to reach server. Please check your connection.', 'error');
            })
            .finally(() => {
                btn.disabled = false;
                btnText.style.opacity = '1';
                loader.style.display = 'none';
            });
        });

        document.querySelector('.close-btn').addEventListener('click', () => {
            document.getElementById('gradeModal').style.display = 'none';
        });

        // Close grade modal when clicking outside of it
        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('gradeModal')) {
                e.target.style.display = 'none';
            }
        });
    </script>
</body>
</html>
