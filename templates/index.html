<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Student Gateway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

</head>
<body>

    <!-- Top Right Login Button -->
    <button id="topLoginBtn" class="top-login-btn">
        <i class="ph ph-sign-in"></i> Admin
    </button>

    <div id="toast-container"></div>

    <div class="card">
        <div class="header">
            <div class="logo-placeholder"><i class="ph-fill ph-graduation-cap"></i></div>
            <h1>Secure Portal</h1>
            <p>Authenticate to access academic records</p>
        </div>

        <form id="entryForm">
            <div class="form-group">
                <label for="accessCode">Access Code</label>
                <div class="input-wrapper">
                    <i class="ph ph-key"></i>
                    <input type="password" id="accessCode" name="accessCode" class="has-toggle" placeholder="Enter unique access code" required>
                    <i class="ph ph-eye toggle-password" id="toggleAccessCode"></i>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group half">
                    <label for="section">Section</label>
                    <div class="input-wrapper">
                        <i class="ph ph-users"></i>
                        <select id="section" name="section" required>
                            <option value="" disabled selected>Select...</option>
                            <option value="BSIT2-3">BSIT2-3</option>
                            <option value="BSIT2-4">BSIT2-4</option>
                            <option value="BSIT2-5">BSIT2-5</option>
                            <option value="BSIT2-6">BSIT2-6</option>
                            <option value="BSIT2-8">BSIT2-8</option>
                            <option value="BSIT2-9">BSIT2-9</option>
                            <option value="BSIT2-11">BSIT2-11</option>
                            <option value="BSIT2-12">BSIT2-12</option>
                        </select>
                    </div>
                </div>

                <div class="form-group half">
                    <label for="subject">Course Subject</label>
                    <div class="input-wrapper">
                        <i class="ph ph-book-bookmark"></i>
                        <select id="subject" name="subject" required>
                            <option value="" disabled selected>Choose...</option>
                            <option value="ITE 300">ITE 300</option>
                            <option value="ITE 298">ITE 298</option>
                            <option value="ITE 031">ITE 031</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">Initialize Query</span>
                <div class="loader" id="btnLoader" style="display: none;"></div>
            </button>
        </form>
    </div>

    <!-- PRO DATA MODAL -->
    <div id="gradeModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 800px; max-height: 90vh; display: flex; flex-direction: column;">
            <button class="close-btn"><i class="ph ph-x"></i></button>
            
            <!-- Sticky Header -->
            <div class="modal-header-pro" style="flex-shrink: 0;">
                <div class="profile-section">
                    <div class="profile-avatar"><i class="ph-fill ph-user"></i></div>
                    <div class="profile-details">
                        <h2 id="modalStudentName">Loading...</h2>
                    </div>
                </div>
                <div class="meta-section">
                    <div class="status-badge"><i class="ph-fill ph-check-circle"></i> Verified Record</div>
                    <p id="modalCourseInfo">Loading Course Info...</p>
                </div>
            </div>
            
            <!-- Scrollable Grades Container -->
            <div id="gradesContainer" style="display: flex; flex-direction: column; gap: 20px; margin-top: 15px; overflow-y: auto; padding-right: 10px; flex-grow: 1;">
                <!-- Block tables injected dynamically -->
            </div>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="adminLoginModal" class="login-modal-overlay">
        <div class="login-modal-content">
            <button class="login-close-btn" id="closeLoginModal"><i class="ph ph-x"></i></button>
            <div class="header" style="margin-bottom: 25px;">
                <h2 style="font-size: 20px; color: #fafafa; margin-bottom: 5px;">Admin Access</h2>
                <p style="font-size: 13px; color: #a1a1aa;">Enter credentials to proceed</p>
            </div>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminUsername">Username</label>
                    <div class="input-wrapper">
                        <i class="ph ph-user"></i>
                        <input type="text" id="adminUsername" required placeholder="Enter username">
                    </div>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="ph ph-lock-key"></i>
                        <input type="password" id="adminPassword" class="has-toggle" required placeholder="Enter password">
                        <i class="ph ph-eye toggle-password" id="toggleAdminPassword"></i>
                    </div>
                </div>
                <button type="submit" class="btn-submit" style="margin-top: 20px;">
                    <span class="btn-text">Login</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Upload Modal -->
    <div id="adminUploadModal" class="login-modal-overlay">
        <div class="login-modal-content">
            <button class="login-close-btn" id="closeUploadModal"><i class="ph ph-x"></i></button>
            <div class="header" style="margin-bottom: 25px;">
                <div class="logo-placeholder" style="width: 40px; height: 40px; font-size: 20px; margin-bottom: 10px;"><i class="ph-fill ph-file-xls"></i></div>
                <h2 style="font-size: 20px; color: #fafafa; margin-bottom: 5px;">Update Records</h2>
                <p style="font-size: 13px; color: #a1a1aa;">Upload the latest Grades.xlsx file</p>
            </div>
            <form id="adminUploadForm">
                <div class="form-group">
                    <div class="file-upload-wrapper">
                        <input type="file" id="excelFile" accept=".xlsx" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="uploadBtn" style="margin-top: 20px;">
                    <span class="btn-text">Upload Grades.xlsx</span>
                    <div class="loader" id="uploadLoader" style="display: none;"></div>
                </button>
            </form>
        </div>
    </div>

    <script>
        // Toggle Password Visibility Logic
        function setupPasswordToggle(toggleIconId, inputId) {
            const toggleIcon = document.getElementById(toggleIconId);
            const inputField = document.getElementById(inputId);

            if (toggleIcon && inputField) {
                toggleIcon.addEventListener('click', function () {
                    const type = inputField.getAttribute('type') === 'password' ? 'text' : 'password';
                    inputField.setAttribute('type', type);
                    
                    this.classList.toggle('ph-eye');
                    this.classList.toggle('ph-eye-slash');
                });
            }
        }

        setupPasswordToggle('toggleAccessCode', 'accessCode');
        setupPasswordToggle('toggleAdminPassword', 'adminPassword');

        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'success' ? 'toast-success' : 'toast-error'}`;
            
            const icon = type === 'error' ? '<i class="ph-fill ph-warning-circle"></i>' : '<i class="ph-fill ph-check-circle"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        document.getElementById('entryForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const btn = document.getElementById('submitBtn');
            const btnText = btn.querySelector('.btn-text');
            const loader = document.getElementById('btnLoader');
            
            btn.disabled = true;
            btnText.style.opacity = '0.5';
            loader.style.display = 'block';

            const payload = {
                accessCode: document.getElementById('accessCode').value,
                section: document.getElementById('section').value,
                subject: document.getElementById('subject').value
            };

            fetch('/get_grades', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    document.getElementById('modalStudentName').textContent = result.student_name;
                    document.getElementById('modalCourseInfo').textContent = `${result.subject_full} • ${result.section}`;
                    
                    const container = document.getElementById('gradesContainer');
                    
                    // Period Legend Bar
                    let htmlContent = `
                        <div class="period-legend">
                            <div class="legend-item"><div class="dot-p1"></div> P1 (Week 1–4 / Mod 1–4)</div>
                            <div class="legend-item"><div class="dot-p2"></div> P2 (Week 5–9 / Mod 5–9)</div>
                            <div class="legend-item"><div class="dot-p3"></div> P3 (Week 10–14 / Mod 10–14)</div>
                        </div>
                    `;

                    if(result.modules_data.length === 0 && result.final_grades.length === 0) {
                        htmlContent = '<div style="text-align:center; color:#a1a1aa; padding: 20px;">No grade records available.</div>';
                    } else {
                        // Render Category Blocks
                        result.modules_data.forEach((cat) => {
                            // Frontend Display Override for Category Title
                            let displayCategoryName = cat.category_name;
                            if (displayCategoryName.includes("SOC")) {
                                displayCategoryName = "Attendance";
                            }

                            htmlContent += `
                                <div class="grade-block" style="background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 16px;">
                                    <div style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #a1a1aa; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                                        ${displayCategoryName}
                                    </div>
                                    <div class="table-scroll-wrapper">
                                        <table class="grades-table-horizontal">
                                            <thead>
                                                <tr>
                                                    ${cat.items.map((item, idx) => {
                                                        const num = idx + 1;
                                                        
                                                        // Determine Period Tag
                                                        let periodClass = "p3";
                                                        if (num <= 4) periodClass = "p1";
                                                        else if (num <= 9) periodClass = "p2";

                                                        // Transform column header label
                                                        let headerText = item.sub_header;
                                                        if (cat.category_name.includes("SOC")) {
                                                            headerText = `WEEK ${num}`;
                                                        } else if (headerText.toLowerCase().includes("mod")) {
                                                            headerText = `Mod ${num}`;
                                                        }

                                                        return `<th class="th-${periodClass}" style="white-space: nowrap; padding: 10px;">${headerText}</th>`;
                                                    }).join('')}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr class="data-row">
                                                    ${cat.items.map((item, idx) => {
                                                        const num = idx + 1;
                                                        
                                                        let periodClass = "p3";
                                                        if (num <= 4) periodClass = "p1";
                                                        else if (num <= 9) periodClass = "p2";

                                                        return `<td class="td-${periodClass}"><div class="grade-cell">${item.value}</div></td>`;
                                                    }).join('')}
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            `;
                        });

                        // Render Final Grades Block
                        if(result.final_grades.length > 0) {
                            htmlContent += `
                                <div class="grade-block" style="background: rgba(99, 102, 241, 0.05); border: 1px solid rgba(99, 102, 241, 0.2); border-radius: 12px; padding: 16px;">
                                    <div style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #a1a1aa; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                                        PERIODIC & FINAL GRADES
                                    </div>
                                    <div class="table-scroll-wrapper">
                                        <table class="grades-table-horizontal">
                                            <thead>
                                                <tr>
                                                    ${result.final_grades.map(fg => `<th class="header-main">${fg.title}</th>`).join('')}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr class="data-row">
                                                    ${result.final_grades.map(fg => `<td class="text-bold highlight-grade">${fg.value}</td>`).join('')}
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            `;
                        }
                    }

                    container.innerHTML = htmlContent;
                    document.getElementById('gradeModal').style.display = 'flex';
                } else {
                    showToast(result.message, 'error');
                }
            })
            .catch(err => {
                console.error('Network Error:', err);
                showToast('Unable to reach server. Please check your connection.', 'error');
            })
            .finally(() => {
                btn.disabled = false;
                btnText.style.opacity = '1';
                loader.style.display = 'none';
            });
        });

        document.querySelector('.close-btn').addEventListener('click', () => {
            document.getElementById('gradeModal').style.display = 'none';
        });

        // Modal triggers
        const topLoginBtn = document.getElementById('topLoginBtn');
        const adminLoginModal = document.getElementById('adminLoginModal');
        const closeLoginModal = document.getElementById('closeLoginModal');
        const adminLoginForm = document.getElementById('adminLoginForm');
        const adminUploadModal = document.getElementById('adminUploadModal');
        const closeUploadModal = document.getElementById('closeUploadModal');
        const adminUploadForm = document.getElementById('adminUploadForm');

        topLoginBtn.addEventListener('click', () => adminLoginModal.style.display = 'flex');
        closeLoginModal.addEventListener('click', () => adminLoginModal.style.display = 'none');
        closeUploadModal.addEventListener('click', () => adminUploadModal.style.display = 'none');

        adminLoginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('adminUsername').value;
            const pass = document.getElementById('adminPassword').value;

            if (user === 'admin' && pass === 'admin123') {
                showToast('Login successful! Welcome Admin.', 'success');
                adminLoginModal.style.display = 'none';
                adminLoginForm.reset();
                setTimeout(() => adminUploadModal.style.display = 'flex', 300); 
            } else {
                showToast('Invalid username or password.', 'error');
            }
        });

        adminUploadForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('excelFile');
            const file = fileInput.files[0];
            
            if (!file) {
                showToast('Please select a file first.', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            const btn = document.getElementById('uploadBtn');
            const btnText = btn.querySelector('.btn-text');
            const loader = document.getElementById('uploadLoader');

            btn.disabled = true;
            btnText.style.opacity = '0.5';
            loader.style.display = 'block';

            fetch('/upload_excel', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    showToast(result.message, 'success');
                    adminUploadModal.style.display = 'none';
                    adminUploadForm.reset();
                } else {
                    showToast(result.message, 'error');
                }
            })
            .catch(err => {
                showToast('Failed to upload file. Please check your connection.', 'error');
            })
            .finally(() => {
                btn.disabled = false;
                btnText.style.opacity = '1';
                loader.style.display = 'none';
            });
        });

        window.addEventListener('click', (e) => {
            const gradeModal = document.getElementById('gradeModal');
            if (e.target === gradeModal) gradeModal.style.display = 'none';
            if (e.target === adminLoginModal) adminLoginModal.style.display = 'none';
            if (e.target === adminUploadModal) adminUploadModal.style.display = 'none';
        });
    </script>
</body>
</html>
