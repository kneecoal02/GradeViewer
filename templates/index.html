<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Gateway</title>
    <!-- Flask specific link to static CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Portal Gateway</h1>
            <p>Please enter your credentials to continue</p>
        </div>

        <form action="#" method="POST" id="entryForm">
            <!-- ID Number Input -->
            <div class="form-group">
                <label for="idNumber">ID Number</label>
                <input type="text" id="idNumber" name="idNumber" placeholder="e.g. 2024-00123" required>
            </div>

            <!-- Section Dropdown -->
            <div class="form-group">
                <label for="section">Section</label>
                <select id="section" name="section" required>
                    <option value="" disabled selected>Select your section...</option>
                    <option value="BSIT2-3">BSIT2-3</option>
                    <option value="BSIT2-11">BSIT2-11</option>
                    <option value="BSIT2-12">BSIT2-12</option>
                </select>
            </div>

            <!-- Period Dropdown -->
            <div class="form-group">
                <label for="period">Period</label>
                <select id="period" name="period" required>
                    <option value="" disabled selected>Select a period...</option>
                    <option value="P1">P1</option>
                    <option value="P2">P2</option>
                    <option value="P3">P3</option>
                </select>
            </div>

            <!-- Subject Dropdown -->
            <div class="form-group">
                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value="" disabled selected>Select a subject...</option>
                    <option value="ITE 300">ITE 300</option>
                    <option value="ITE 298">ITE 298</option>
                    <option value="ITE 031">ITE 031</option>
                </select>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Proceed</button>
        </form>
    </div>

</body>
</html>
